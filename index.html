<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>cardwall</title>
  <script src="renderer/theme-boot.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="toolbar">
      <span class="brand">cardwall</span>
      <span class="hint">拖动即定住 · P 重新漂浮 · 双击编辑 · 双击空白新建 · 拖到卡片上改挂 · Delete 删除 · 滚轮缩放 · 拖空白平移 · ⌘⇧L 主题</span>
    </header>
    <div id="viewport">
      <div id="world">
        <svg id="edges"></svg>
        <!-- cards injected by renderer/app.js -->
      </div>
    </div>
    <div id="debug-panel"></div>
  </div>
  <script src="renderer/physics.js"></script>
  <script src="renderer/sample.js"></script>
  <script src="renderer/interaction.js"></script>
  <script src="renderer/debug.js"></script>
  <script src="renderer/app.js"></script>
</body>
</html>
